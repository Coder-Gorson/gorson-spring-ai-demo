services:
  redis:
    image: redis:8
    container_name: spring-ai-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data: