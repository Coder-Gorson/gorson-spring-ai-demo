server:
  port: 18880
spring:
  application:
    name: gorson-spring-ai-lab
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  data:
    redis:
      client-type: jedis
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
  ai:
    vectorstore:
      redis:
        initialize-schema: true
        index-name: gorson-rag-index-v5
        prefix: "gorson:rag:v5"
        distance-metric: COSINE
        vector-algorithm: HNSW
    model:
      chat: deepseek
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      embedding:
        base-url: https://api.siliconflow.cn/v1
        api-key: ${SILICONFLOW_API_KEY}
        model: BAAI/bge-m3
        encoding-format: float
    chat:
      memory:
        repository:
          redis:
            host: 127.0.0.1
            port: 6379
            password: ${REDIS_PASSWORD}
            index-name: spring-ai-chat-memory-idx
            key-prefix:
              spring-ai:chat-memory:
            time-to-live: 24h
            initialize-schema: true
            max-conversation-ids: 1000
            max-messages-per-conversation: 1000
    mcp:
      server:
        enabled: false
        name: gorson-project-tools
        protocol: STREAMABLE
        tool-callback-converter: false
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-flash
logging:
  level:
    org.springframework.ai.vectorstore.redis: DEBUG